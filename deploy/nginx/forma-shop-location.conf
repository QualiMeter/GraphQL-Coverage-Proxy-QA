# Include in the existing HTTPS server for graphql.rebyte.fun.
# The FORMA storefront binds only to 127.0.0.1:9110; do not expose its port.
# Trailing slash is required so relative assets/api URLs stay under /shop/.
location = /shop {
    return 308 /shop/;
}

location ^~ /shop/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:9110/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 55s;
    proxy_send_timeout 55s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control no-store always;
}
