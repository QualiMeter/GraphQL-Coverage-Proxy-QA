name: API integration tests
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend ref override (defaults to main with Test Coverage API)
        default: ''
        required: false
      frontend_ref:
        description: Coverage frontend ref to test
        default: main
        required: true
  push:
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QA_BACKEND_REF: ${{ inputs.backend_ref || 'main' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/api-tests/.browsers
      QA_FRONTEND_DIST: ${{ github.workspace }}/coverage-frontend/dist
    steps:
      - uses: actions/checkout@v4
        with:
          path: api-tests
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: QualiMeter/GraphQL-Coverage-Proxy-Frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: coverage-frontend
          token: ${{ secrets.COVERAGE_FRONTEND_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: QualiMeter/GraphQL-Coverage-Proxy-Beckend
          ref: ${{ env.QA_BACKEND_REF }}
          path: coverage-backend
          token: ${{ secrets.COVERAGE_BACKEND_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record component revisions
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          revisions = {
              name: subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
              for name, path in {"qa": "api-tests", "backend": "coverage-backend", "frontend": "coverage-frontend"}.items()
          }
          output = Path("api-tests/reports/component-revisions.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(revisions, indent=2), encoding="utf-8")
          print(json.dumps(revisions, indent=2))
          PY
      - name: Build frontend for TST-07
        working-directory: coverage-frontend
        run: |
          npm ci
          npm run build
      - run: python -m pip install -r requirements.lock.txt
        working-directory: api-tests
      - run: python -m pip install -e . --no-deps
        working-directory: api-tests
      - run: python -m playwright install --with-deps chromium
        working-directory: api-tests
      - name: Install MVP acceptance dependencies
        working-directory: api-tests
        run: |
          python -m pip install -r acceptance/mvp/requirements.txt
          npm ci --prefix acceptance/mvp
          cd acceptance/mvp
          npx --no-install playwright install --with-deps chromium
      - name: Verify Playwright runner metadata and redirect safety
        working-directory: api-tests
        run: node --test integrations/playwright/index.test.cjs
      - run: python -m coverage_qa test --coverage-backend-dir ../coverage-backend
        working-directory: api-tests
      - name: Backend unit tests for analysis, schema parsing and document storage
        working-directory: coverage-backend
        run: python -m pytest -q tests/test_query_analyzer.py tests/test_schema_parser.py tests/test_safe_document.py
      - name: Verify nine-field MVP and persistence
        working-directory: api-tests
        run: |
          python -m acceptance.mvp.run --export-graph reports/gate-input.json
          python -m coverage_qa gitlab gate --graph-file reports/gate-input.json --min-coverage 66.67 --junit-out reports/gate.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            api-tests/reports/
            !api-tests/reports/**/*.zip
